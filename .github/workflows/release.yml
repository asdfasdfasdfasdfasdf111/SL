# 发版流水线：打 v* 标签 → Release 编译 → 打包 dmg → 创建 GitHub Release 并上传 → 同步服务器。
#
# 与 test.yml 的分工：test.yml 管「push/PR 的用例门禁」，本文件只在发版标签上跑。
# 产物（qwq-<tag>.dmg）是 App 内自动更新（AppUpdateService → AppUpdateCoordinator）
# 的更新源：releases/latest 的 tag_name 供版本比较，dmg 资产供下载换装，
# 因此**发版必须带 dmg**（zip 仅为 App 端兜底解析，不再作为发版主产物）。
#
# 发布完成后自动调用 apple.ct.ws/publish.php（GitHub Actions 解 slowAES 挑战后
# 带 key 触发），服务器把最新 dmg 同步到本站 updates/ 并改写 latest.json ——
# App 检查更新时读到的是服务器已就位的最新版本，无需每次打开都检测。
#
# 前置：仓库必须保持 public（Releases API 与资产下载走匿名访问）；
#       仓库 Secrets 需配 PUBLISH_KEY（服务器 publish.php 的鉴权 key）。

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "runner 上没有找到 Xcode"
            exit 1
          fi
          echo "使用 $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Release 编译
        run: |
          xcodebuild -project qwq.xcodeproj -scheme qwq -configuration Release build \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tail -5

      - name: 打包 dmg
        run: |
          hdiutil create -volname "SL 启动器" -srcfolder build/Build/Products/Release/qwq.app \
            -ov -format UDZO -imagekey zlib-level=9 "qwq-${GITHUB_REF_NAME}.dmg"
          ls -la "qwq-${GITHUB_REF_NAME}.dmg"

      - name: 创建 Release 并上传 dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "qwq-${GITHUB_REF_NAME}.dmg" \
            --title "$GITHUB_REF_NAME (Beta)" \
            --notes "Beta 版本，自动构建于 commit ${GITHUB_SHA::7}；发布后本站 apple.ct.ws 自动同步，App 内「检查更新」即可获得。" \
            --verify-tag

  # 发布后同步到 apple.ct.ws：解 slowAES 挑战 → 调 publish.php → 服务器拉最新包
  sync-server:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 触发服务器同步
        env:
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, urllib.request

          key = os.environ["PUBLISH_KEY"]
          url = "https://apple.ct.ws/publish.php"

          def call(cookie=None):
              req = urllib.request.Request(url + "?key=" + key,
                  headers={"User-Agent": "SL-Release-Sync/1.0"})
              if cookie:
                  req.add_header("Cookie", "__test=" + cookie)
              with urllib.request.urlopen(req, timeout=120) as r:
                  return r.read().decode(errors="replace")

          page = call()
          if "toNumbers(" in page:
              # InfinityFree 对所有请求先发 slowAES 挑战：解出 __test cookie 后再调一次
              a = re.search(r'a=toNumbers\("([0-9a-f]{32})"', page).group(1)
              b = re.search(r'b=toNumbers\("([0-9a-f]{32})"', page).group(1)
              c = re.search(r'c=toNumbers\("([0-9a-f]{32})"', page).group(1)
              pt = subprocess.run(["openssl", "enc", "-d", "-aes-128-cbc", "-K", a, "-iv", b, "-nopad"],
                  input=bytes.fromhex(c), capture_output=True, check=True).stdout
              result = call(cookie=pt.hex())
          else:
              # 主机无挑战页：首次请求已是真实响应（ok / forbidden / error）
              result = page
          print("sync result:", result)
          if not result.startswith("ok"):
              raise SystemExit("sync failed: " + result)
          PY