# 发版流水线：打 v* 标签 → Release 编译 → 打包 dmg → 创建 GitHub Release 并上传 → 同步服务器。
#
# 与 test.yml 的分工：test.yml 管「push/PR 的用例门禁」，本文件只在发版标签上跑。
# 产物（qwq.dmg）是 App 内自动更新（AppUpdateService → AppUpdateCoordinator）
# 的更新源：releases/latest 的 tag_name 供版本比较，dmg 资产供下载换装，
# 因此**发版必须带 dmg**（zip 仅为 App 端兜底解析，不再作为发版主产物）。
#
# 包名**固定为 qwq.dmg**（不带版本号，2026-10-10 起）：客户端只看资产名是否以
# .dmg/.zip 结尾，版本号取自 tag_name 而不是文件名；固定名让站点就地覆盖同一个文件，
# 既不会在免费主机上按版本堆积安装包，也不存在「旧链接失效」。代价是必须让
# updates/*.dmg 不可缓存（见 update-server/htdocs/.htaccess 的 no-store）。
#
# 发布完成后自动调用 apple.ct.ws/publish.php（GitHub Actions 解 slowAES 挑战后
# 带 key 触发），服务器把最新 dmg 同步到本站 updates/ 并改写 latest.json ——
# App 检查更新时读到的是服务器已就位的最新版本，无需每次打开都检测。
#
# 前置：仓库必须保持 public（Releases API 与资产下载走匿名访问）；
#       仓库 Secrets 需配 PUBLISH_KEY（服务器 publish.php 的鉴权 key）。

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          # ⚠️ 不能无脑取最新：runner 上最新的 Xcode 26.6 在本工程的 Release 配置下
          # 会让 swift-frontend 崩溃（先是整模块 SwiftCompile、改逐文件编译后挪到
          # SwiftEmitModule，日志里只有 "Please submit a bug report" + Stack dump），
          # 而构建步骤失败会被当成成功 → 曾经连发三个「没有主程序的空壳 App」。
          # 26.2 在本机实测 arm64 与 x86_64 的 Release 都能编译通过且产物可运行，
          # 故固定到它；找不到时退回最新版并给出警告（此时构建失败会被上面的
          # pipefail 拦下，不会再产出发不出去的包）。
          pick=""
          for v in 26.2.0 26.2; do
            if [ -d "/Applications/Xcode_$v.app" ]; then pick="/Applications/Xcode_$v.app"; break; fi
          done
          if [ -z "$pick" ]; then
            echo "::warning::runner 上没有固定的 Xcode 26.2，退回最新版（可能触发 swift-frontend 崩溃）"
            pick=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$pick" ]; then
            echo "runner 上没有找到 Xcode"
            exit 1
          fi
          echo "使用 $pick"
          sudo xcode-select -s "$pick"
          xcodebuild -version

      # ⚠️ 这里**绝不能**再写成 `xcodebuild … | tail -5`：管道的退出码是 `tail` 的，
      # 构建失败也会被当成成功。2026-10-10 实测的后果：Release 在 Xcode 26.6 下编译失败，
      # 步骤显示 success → 继续把**半成品 bundle**（资源拷完、主程序还没生成）打成 dmg 发布，
      # 于是 v1.7.0/v1.7.1/v1.7.2 三个线上包都是「没有可执行文件的空壳 App」，
      # 任何用户自动更新后都打不开（旧包还被换装脚本删掉了）。失败必须失败。
      - name: Release 编译
        run: |
          set -o pipefail
          # 这里**绝不能**再写成 `xcodebuild … | tail -5`：管道的退出码是 tail 的，
          # 构建失败也会返回 0。2026-10-10 的后果是 v1.7.0/v1.7.1/v1.7.2 三个线上包
          # 都是「资源拷完、主程序还没生成的半成品 bundle」。失败必须失败。
          xcodebuild -project qwq.xcodeproj -scheme qwq -configuration Release build \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES \
            > /tmp/build.log 2>&1 || {
              echo "===== 构建失败：错误摘要 ====="
              grep -aE '\.swift:[0-9]+:[0-9]+: (error|warning):|error: |failed|FAILED' /tmp/build.log | head -60
              echo "===== 日志末尾 120 行（失败汇总总在最后） ====="
              tail -120 /tmp/build.log
              exit 1
            }
          tail -3 /tmp/build.log

      # 打包前先证明这个 bundle 是**能运行的**：主程序在、签名在、版本号与 tag 一致。
      # 这三条各自对应一次真实事故：主程序缺失（空壳包）、未签名（arm64 起不来）、
      # 版本落后于 tag（App 会反复提示同一个更新，装完还是旧版）。
      - name: 校验 bundle（主程序 / 签名 / 版本号）
        run: |
          APP=build/Build/Products/Release/qwq.app
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          echo "CFBundleExecutable=$EXEC  CFBundleShortVersionString=$VER  tag=$GITHUB_REF_NAME"
          if [ ! -x "$APP/Contents/MacOS/$EXEC" ]; then
            echo "::error::bundle 里没有可执行文件（$APP/Contents/MacOS/$EXEC）—— 拒绝发版"
            ls -la "$APP/Contents/MacOS" || true
            exit 1
          fi
          if ! codesign --verify --deep --strict "$APP"; then
            echo "::error::签名校验失败 —— 未签名的 App 在 Apple Silicon 上根本起不来，拒绝发版"
            exit 1
          fi
          if [ "v$VER" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag（$GITHUB_REF_NAME）与 App 版本（$VER）不一致 —— 会让用户反复收到同一个更新，拒绝发版"
            exit 1
          fi

      - name: 打包 dmg
        run: |
          hdiutil create -volname "SL 启动器" -srcfolder build/Build/Products/Release/qwq.app \
            -ov -format UDZO -imagekey zlib-level=9 "qwq.dmg"
          ls -la "qwq.dmg"

      - name: 创建 Release 并上传 dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "qwq.dmg" \
            --title "$GITHUB_REF_NAME (Beta)" \
            --notes "Beta 版本，自动构建于 commit ${GITHUB_SHA::7}；发布后本站 apple.ct.ws 自动同步，App 内「检查更新」即可获得。" \
            --verify-tag

  # 发布后同步到 apple.ct.ws：解 slowAES 挑战 → 调 publish.php → 服务器拉最新包
  sync-server:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 触发服务器同步
        env:
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, urllib.request

          key = os.environ["PUBLISH_KEY"]
          url = "https://apple.ct.ws/publish.php"

          def call(cookie=None):
              req = urllib.request.Request(url + "?key=" + key,
                  headers={"User-Agent": "SL-Release-Sync/1.0"})
              if cookie:
                  req.add_header("Cookie", "__test=" + cookie)
              with urllib.request.urlopen(req, timeout=120) as r:
                  return r.read().decode(errors="replace")

          page = call()
          if "toNumbers(" in page:
              # InfinityFree 对所有请求先发 slowAES 挑战：解出 __test cookie 后再调一次
              a = re.search(r'a=toNumbers\("([0-9a-f]{32})"', page).group(1)
              b = re.search(r'b=toNumbers\("([0-9a-f]{32})"', page).group(1)
              c = re.search(r'c=toNumbers\("([0-9a-f]{32})"', page).group(1)
              pt = subprocess.run(["openssl", "enc", "-d", "-aes-128-cbc", "-K", a, "-iv", b, "-nopad"],
                  input=bytes.fromhex(c), capture_output=True, check=True).stdout
              result = call(cookie=pt.hex())
          else:
              # 主机无挑战页：首次请求已是真实响应（ok / forbidden / error）
              result = page
          print("sync result:", result)
          if not result.startswith("ok"):
              raise SystemExit("sync failed: " + result)
          PY